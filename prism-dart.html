<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATRIA WAVE ARCADE</title>
<style>
:root{--bg:#0b0b1a;--fg:#f4f6ff;--ac:#22e3ff;--ac2:#ff3ea5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:12px;pointer-events:none;font-weight:700;letter-spacing:.08em;font-size:13px}
#bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#pct{min-width:44px;text-align:right}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(6,6,20,.6);backdrop-filter:blur(4px);padding:20px}
.ov.hide{display:none}
h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.12em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0;font-size:clamp(26px,6vw,44px);letter-spacing:.1em}
p{margin:0;opacity:.8;max-width:380px;line-height:1.5}
button{font:inherit;font-weight:800;letter-spacing:.1em;padding:14px 34px;border:0;border-radius:999px;color:#06061a;background:linear-gradient(90deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 0 24px rgba(34,227,255,.45)}
button:active{transform:scale(.96)}
#hud button{pointer-events:auto;padding:6px 10px;font-size:14px;box-shadow:none;background:rgba(255,255,255,.16);color:var(--fg);letter-spacing:0}
.ov{overflow:auto;justify-content:flex-start}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(420px,92vw)}
.grid button{padding:12px 0;font-size:18px;line-height:1.1;box-shadow:none}
.grid button small{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;opacity:.7}
.grid button:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.35);cursor:not-allowed}
.sec{background:rgba(255,255,255,.16);color:var(--fg);box-shadow:none}

.ov::before,.ov::after{content:'';flex:1 0 0}
.bk{position:absolute;top:14px;right:16px;font-weight:800;color:#ffe14d}
label{display:flex;flex-direction:column;gap:6px;width:min(320px,86vw);font-weight:700;letter-spacing:.08em;font-size:13px;text-align:left}
input[type=range]{width:100%;accent-color:var(--ac)}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.seg button{padding:10px 14px;font-size:12px}.seg .on{outline:2px solid var(--ac)}
.sg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.lq .ov{backdrop-filter:none;background:rgba(6,6,20,.88)}
#menu button{min-width:210px}
@keyframes sh{to{background-position:200% 0}}
h1{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac)) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;line-height:1.1}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}.ml{display:flex;flex-direction:column;gap:6px;width:min(360px,90vw);font-size:13px;text-align:left}.ml div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;justify-content:space-between;gap:10px}.ml .ok{outline:1px solid #37ff9a}
</style></head>
<body><div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><span id="lvl">LEVEL 1</span><span id="shc" style="color:#ffe14d"></span><div id="bar"><div id="fill"></div></div><span id="pct">0%</span><button id="bMute">🔊</button><button id="bPz">⏸</button><button class="toL">☰</button></div>
<div class="ov" id="menu"><div id="bk" class="bk"></div><h1>SATRIA<br>WAVE ARCADE</h1><button id="bPlay">MAIN</button><button class="sec" data-s="lvls">LEVEL</button><button class="sec" data-s="misi">MISI</button><button class="sec" data-s="skins">KAPAL</button><button class="sec" data-s="sett">PENGATURAN</button></div>
<div class="ov hide" id="lvls"><h2>LEVEL</h2><div class="grid" id="grid"></div><div class="seg"><button class="sec" id="bEnd">TANPA AKHIR</button><button class="sec" id="bWk">MINGGUAN</button><button class="sec" id="bPrac">LATIHAN: MATI</button></div><div class="seg"><input id="kd" type="number" placeholder="Kode level" style="width:130px;padding:10px;border-radius:10px;border:0"><button class="sec" id="bKd">MAIN KODE</button></div><button class="sec" data-s="menu">KEMBALI</button></div>
<div class="ov hide" id="skins"><h2>KAPAL <span id="sbk" style="color:#ffe14d"></span></h2><div class="grid sg" id="sk"></div><h2 style="font-size:16px">TRAIL</h2><div class="grid sg" id="fxg"></div><button class="sec" data-s="menu">KEMBALI</button></div>
<div class="ov hide" id="sett"><h2>PENGATURAN</h2><label>MUSIK<input type="range" id="rm" min="0" max="100"></label><label>EFEK<input type="range" id="rs" min="0" max="100"></label><label>SENSITIVITAS<input type="range" id="rse" min="20" max="50"></label><div class="seg" id="tg"></div><div style="font-weight:700;font-size:13px;letter-spacing:.08em">KUALITAS</div><div class="seg" id="qs"></div><button class="sec" data-s="menu">KEMBALI</button></div>
<div class="ov hide" id="misi"><h2>MISI HARIAN</h2><div id="ml" class="ml"></div><h2>PENCAPAIAN</h2><div id="al" class="ml"></div><button class="sec" data-s="menu">KEMBALI</button></div>
<div class="ov hide" id="pause"><h2>JEDA</h2><button id="bRes">LANJUT</button><button class="sec toL">LOBI</button></div>
<div id="toast"></div>

<div class="ov hide" id="win"><h2 id="wmsg">LEVEL SELESAI</h2><p id="wp"></p><button id="bNext">LEVEL BERIKUTNYA</button><button class="sec toL">LOBI</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const VH=600,R=6;let S,oy,vw;var Q={st:60,bg:1,g:1,sb:1,pt:1,d:2,f:0,tx:1},cfg={mv:.8,sv:.8,q:0,vb:1,rf:0,se:30,cb:0},endless=false,wk=0;
function rs(){const d=Math.min(devicePixelRatio||1,Q.d);cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;S=Math.min(cv.height/VH,cv.width/780);oy=(cv.height/S-VH)/2;vw=cv.width/S}
addEventListener('resize',rs);rs();
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(lv){
  const r=rng(wk?wk:lv*7919+13),sp=[],len=endless?60000:4200+lv*900,speed=Math.min(300+lv*28,620);
  const gap=Math.max(200,330-lv*12),maxH=VH-gap;let x=900;
  while(x<len-500){
    const t=r(),n=1+(r()<.3+lv*.03?1:0)+(r()<.15?1:0),m=t<.35?0:t<.7?1:2;
    let hf=0,hc=0;
    if(m===0)hf=60+r()*(Math.min(230,maxH)-60);
    else if(m===1)hc=60+r()*(Math.min(230,maxH)-60);
    else{hf=60+r()*(maxH-120);hc=60+r()*(maxH-hf-60)}
    const w=Math.max(hf,hc)*.55+30;
    for(let k=0;k<n;k++){
      const f=k?.7+r()*.3:1,x0=x+k*w,x1=x0+w,xm=x0+w/2;
      if(hf)sp.push({x0,x1,xm,yb:VH,yt:VH-hf*f});
      if(hc)sp.push({x0,x1,xm,yb:0,yt:hc*f});
    }
    x+=n*w+Math.max(110,330-lv*20)+r()*120;
  }
  if(lv>=4)for(const s of sp)if(r()<.35){s.y0=s.yt;s.a=.45;s.ph=r()*6.28}
  const free=x=>!sp.some(s=>x>s.x0-50&&x<s.x1+50),sh=[];
  for(let x=1100;x<len-300;x+=230+r()*120){let xx=x;for(let k=0;k<6&&!free(xx);k++)xx+=40;if(free(xx))sh.push({x:xx,y:160+r()*280,t:0})}
  for(const f of[.35,.7]){let xx=len*f;while(!free(xx))xx+=30;sh.push({x:xx,y:VH/2,t:1})}
  const cps=[.25,.5,.75].map(f=>{let x=len*f;while(!free(x))x+=30;return x}),zn=[];
  if(lv>1)for(const f of[.18,.46,.78])zn.push({x0:len*f+r()*250,m:r()<.5?1.35:.75});
  const fy=x=>{while(!free(x))x+=30;return x},po=[],rc=[];
  if(lv>=3)for(const[f,t]of[[.3,0],[.4,1]])po.push({x:fy(len*f),t});
  if(lv>=5)for(const[f,t]of[[.6,2],[.7,3]])po.push({x:fy(len*f),t});
  if(lv>=3)for(let x=1400;x<len-600;x+=900+r()*500){let xx=x;while(!free(xx)||!free(xx+60))xx+=30;rc.push(r()<.5?{x:xx,w:22,k:0,a:110,ph:r()*6.28}:{x:xx,w:70,k:1,a:150,ph:r()*6.28})}
  return{len,speed,sp,sh,cps,zn,po,rc,boss:lv%5===0&&!endless&&!wk};
}
function inTri(x,y,A,B,C){const c=(P,Q)=>(Q[0]-P[0])*(y-P[1])-(Q[1]-P[1])*(x-P[0]),a=c(A,B),b=c(B,C),d=c(C,A);return!((a<0||b<0||d<0)&&(a>0||b>0||d>0))}
function seg(x,y,P,Q){const dx=Q[0]-P[0],dy=Q[1]-P[1];let t=((x-P[0])*dx+(y-P[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(x-P[0]-t*dx,y-P[1]-t*dy)}
function hit(s,x,y,r){const A=[s.x0,s.yb],B=[s.x1,s.yb],C=[s.xm,s.yt];return inTri(x,y,A,B,C)||seg(x,y,A,C)<r||seg(x,y,B,C)<r}

let st='menu',lv=1,L=gen(1),px=0,py=300,vy=0,sp=300,hold=false,trail=[],parts=[],ring=null,shake=0,tok=0,canRestart=false,tm=0,hue=190;
const stars=Array.from({length:60},()=>({x:Math.random()*2000,y:Math.random()*VH,z:.1+Math.random()*.5,r:.6+Math.random()*1.6}));
function setTh(i){T=TH[i];hue=T.h;const e=document.documentElement.style;e.setProperty('--ac',`hsl(${hue} 100% 60%)`);e.setProperty('--ac2',`hsl(${(hue+140)%360} 100% 62%)`)}
function setHue(){setTh((lv-1)%TH.length)}
function show(id,on){$(id).classList.toggle('hide',!on)}
function start(n,cp){tok++;const keep=cp&&n===lv&&cpx>0;lv=n;if(!keep){L=gen(n);cpx=0;cnt=0}sp=L.speed;spd=sp;px=keep?cpx:0;py=VH/2;vy=0;shield=SK[skin].n==='Hantu';inv=keep?1:0;applyPo();rep=null;rec=[];pzd=0;bt=2;trail=[];parts=[];ring=null;shake=0;canRestart=false;st='ready';mode='game';setHue();$('lvl').textContent=(endless?'TANPA AKHIR':wk?'KODE LEVEL':'LV '+lv)+' · '+T.n+(L.boss?' · BOSS':'')+(prac?' · LATIHAN':'');scr('')}
function burst(c,n){n=Math.ceil(n*Q.pt);for(let i=0;i<n;i++){const a=Math.random()*6.283,v=80+Math.random()*380;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.7,m:1.2,c:c(i)})}ring={x:px,y:py,t:0}}
function die(){st='dead';mode='off';rep=rec.length>20?rec.slice(-150):null;ri=0;if(cfg.vb&&navigator.vibrate)navigator.vibrate(70);mark(endless?Math.floor(px/10):Math.floor(px/L.len*100));sfx('die');shake=.5;burst(i=>`hsl(${(hue+i*9)%360} 100% 65%)`,46);const k=++tok;
  $('dmsg').textContent=endless?Math.floor(px/10)+' m':Math.floor(px/L.len*100)+'%';
  setTimeout(()=>{if(tok===k){show('dead',true);$('bCp').style.display=cpx?'':'none';canRestart=true}},650)}
function win(){st='win';px=L.len;mode='lobby';if(!(prac||wk||endless)){unlock=Math.max(unlock,lv+1);pg.wins++;day.w++;if(L.boss)pg.bw++}const tot=L.sh.filter(o=>!o.t).length||1,q=cnt/tot,rt=q>=.9?3:q>=.6?2:1;if(!(prac||wk||endless))rate[lv]=Math.max(rate[lv]||0,rt);mark(100);sfx('win');$('wp').textContent='★'.repeat(rt)+'☆'.repeat(3-rt)+'  '+cnt+'/'+tot+' ◆';burst(i=>`hsl(${i*20%360} 100% 65%)`,60);const k=++tok;$('wmsg').textContent='LEVEL '+lv+' SELESAI';setTimeout(()=>{if(tok===k)show('win',true)},600)}

function step(dt){
  if(st==='menu'){px+=300*dt;py=300+Math.sin(px/70)*100;vy=Math.cos(px/70)*100*300/70;sp=300;spd=300;trail.push({x:px,y:py});while(trail.length&&px-trail[0].x>170)trail.shift();if(px>L.len-300){px=0;trail=[]}return}
  if(st==='ready'){if(hold)st='play';return}
  if(st!=='play')return;
  inv=Math.max(0,inv-dt);if(endless){sp=Math.min(L.speed+px*.003,720);const i=Math.floor(px/5000)%TH.length;if(T!==TH[i])setTh(i)}spd=sp*zm();vy+=(((hold!==rev)?-spd:spd)-vy)*(1-Math.exp(-dt*cfg.se*(SK[skin].n==='Jarum'?1.4:1)));py+=vy*dt;px+=spd*dt;
  trail.push({x:px,y:py});while(trail.length&&px-trail[0].x>170)trail.shift();
  if(py<R){if(!inv&&!shield)return die();if(!inv){shield=false;inv=1.2;shake=.25;burst(()=>'#7df',22);sfx('pick')}py=R;vy=Math.max(vy,0)}if(py>VH-R){py=VH-R;if(vy>0)vy=0}
  for(const s of L.sp)if(!inv&&s.x1>px-12&&s.x0<px+12&&hit(s,px,py,5*sc)){if(!shield)return die();shield=false;inv=1.2;shake=.25;burst(()=>'#7df',22);sfx('pick');break}
  const rg=SK[skin].n==='Emas'?80:26;for(const o of L.sh)if(!o.got&&Math.abs(o.x-px)<rg&&Math.abs(o.y-py)<rg){o.got=true;if(o.t)shield=true;else{cnt++;day.sh++;pg.tot++;if(!prac)bank++}sfx('pick')}
  for(const o of L.po)if(!o.u&&px>=o.x){o.u=1;apPo(o);sfx('pick')}
  if(!inv)for(const o of L.rc)if(Math.abs(px-o.x-o.w/2)<o.w/2+5*sc&&rr(o).some(([a,b])=>py+5*sc>a&&py-5*sc<b)){if(!shield)return die();shield=false;inv=1.2;shake=.25;burst(()=>'#7df',22);sfx('pick');break}
  if(L.boss&&(bt-=dt)<=0){bt=Math.max(.6,1.2-lv*.02);const x=px+vw*.78+Math.random()*80,y=110+Math.random()*380;L.sp=L.sp.filter(s=>s.x1>px-300);L.sp.push({x0:x,x1:x+50,xm:x+25,yb:y+28,yt:y-28})}
  day.m+=spd*dt/10;
  for(const c of L.cps)if(c>cpx&&px>=c&&(prac||c===L.cps[1])){cpx=c;cpFlash=1.5;sfx('pick')}
  if(px>=L.len)win();
}
function draw(){
  const sx=vw*.22,cam=px-sx,ac=`hsl(${hue} 100% 60%)`,ac2=`hsl(${(hue+140)%360} 100% 60%)`,top=-oy-10,full=cv.height/S+20;
  ctx.setTransform(S,0,0,S,0,oy*S);
  if(shake>0&&!cfg.rf)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,`hsl(${hue} 60% 10%)`);g.addColorStop(1,`hsl(${hue+60} 60% 5%)`);
  ctx.fillStyle=g;ctx.fillRect(-40,top-40,vw+80,full+80);
  bgd(cam,vw);for(const s of stars.slice(0,Q.st)){ctx.fillStyle=`rgba(255,255,255,${.25+s.z})`;ctx.fillRect(((s.x-cam*s.z)%vw+vw)%vw,s.y,s.r,s.r)}
  ctx.strokeStyle=`hsla(${hue},100%,60%,${Q.g&&T.s===0?.08:0})`;ctx.lineWidth=1;ctx.beginPath();
  for(let x=-((cam*.4)%90);x<vw;x+=90){ctx.moveTo(x,0);ctx.lineTo(x,VH)}
  for(let y=0;y<=VH;y+=100){ctx.moveTo(0,y);ctx.lineTo(vw,y)}ctx.stroke();
  for(const z of L.zn){const x=z.x0-cam;if(x>vw||x<-320)continue;ctx.fillStyle=z.m>1?'rgba(255,62,165,.13)':'rgba(34,227,255,.13)';ctx.fillRect(x,0,320,VH);ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='700 44px system-ui';ctx.textAlign='center';ctx.fillText(z.m>1?'»»»':'«««',x+160,VH/2+14)}
  for(const c of L.cps){if(!(prac||c===L.cps[1]))continue;ctx.fillStyle=c<=cpx?'#37ff9a':'rgba(255,255,255,.22)';ctx.fillRect(c-cam-2,0,4,VH)}
  if(cpFlash>0){ctx.fillStyle='#37ff9a';ctx.globalAlpha=Math.min(1,cpFlash);ctx.font='800 26px system-ui';ctx.textAlign='center';ctx.fillText('CHECKPOINT',vw/2,VH*.22);ctx.globalAlpha=1}
  for(const o of L.po){const x=o.x-cam;if(x<-30||x>vw+30)continue;const pc=['#4dffd2','#fff','#ff3ea5','#fff'][o.t];ctx.fillStyle=pc;ctx.globalAlpha=.12;ctx.fillRect(x-9,0,18,VH);ctx.strokeStyle=pc;ctx.lineWidth=3;ctx.setLineDash([14,10]);for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(x,VH/2,10+k*3,150+k*30,0,0,6.283);ctx.globalAlpha=.9-k*.2;ctx.lineDashOffset=-tm*60*(k%2?-1:1);ctx.stroke()}ctx.setLineDash([]);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='700 20px system-ui';ctx.textAlign='center';ctx.fillText(['S','L','⇅','⇅'][o.t],x,VH/2)}
  for(const o of L.rc){const x=o.x-cam;if(x<-80||x>vw+30)continue;ctx.fillStyle=`hsl(${(hue+90)%360} 90% 55%)`;for(const[a,b]of rr(o)){if(Q.tx){ctx.save();ctx.translate(x,a);ctx.fillStyle=ptn(o.k?'b'+T.s:'gt');ctx.fillRect(0,0,o.w,b-a);ctx.restore()}else ctx.fillRect(x,a,o.w,b-a);ctx.strokeStyle=ac;ctx.lineWidth=2;ctx.strokeRect(x,a,o.w,b-a)}}
  ctx.shadowColor=ac2;ctx.shadowBlur=14*Q.sb;ctx.fillStyle=`hsl(${(hue+140)%360} 90% 45%)`;ctx.strokeStyle=ac2;ctx.lineWidth=2;
  for(const s of L.sp){if(s.x1-cam<-20||s.x0-cam>vw+20)continue;ctx.beginPath();ctx.moveTo(s.x0-cam,s.yb);ctx.lineTo(s.xm-cam,s.yt);ctx.lineTo(s.x1-cam,s.yb);ctx.closePath();ctx.fill();if(Q.tx){const h=Math.abs(s.yb-s.yt),w=s.x1-s.x0;ctx.save();ctx.clip();ctx.shadowBlur=0;ctx.translate((s.x0+s.x1)/2-cam,(s.yb+s.yt)/2);ctx.scale(1,s.yb<s.yt?-1:1);ctx.drawImage(tex(),-w/2,-h/2,w,h);ctx.restore()}ctx.stroke()}
  const fx=L.len-cam;if(fx<vw+40){ctx.shadowColor=ac;ctx.fillStyle=ac;ctx.globalAlpha=.8;for(let y=0;y<VH;y+=30)ctx.fillRect(fx,y,14,15),ctx.fillRect(fx+14,y+15,14,15);ctx.globalAlpha=1}

function zm(){for(const z of L.zn)if(px>=z.x0&&px<z.x0+320)return z.m;return 1}
const ROOT=[57,53,48,55],ARP=[0,7,12,15,12,7,3,7],mf=m=>440*2**((m-69)/12);
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  mg=ac.createGain();sg=ac.createGain();mg.connect(ac.destination);sg.connect(ac.destination);dst=mg;applyVol();const n=ac.sampleRate*.2;nb=ac.createBuffer(1,n,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  nextT=ac.currentTime+.1;setInterval(sched,40)}if(ac.state==='suspended')ac.resume()}
function note(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(dst);o.start(t);o.stop(t+.2)}
function hat(t,v){const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.buffer=nb;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(dst);s.start(t);s.stop(t+.06)}
function sched(){dst=mg;
  if(mode==='off'){nextT=Math.max(nextT,ac.currentTime+.05);return}
  const g=mode==='game',dur=60/(g?Math.min(118+lv*4,168):88)/4;
  while(nextT<ac.currentTime+.15){
    const s=stp%16,r=ROOT[(stp>>4)%4]+(g?(lv*2)%12:0),t=nextT;
    if(g){if(s%4===0)kick(t);if(s%2)hat(t,.12);if(s%2===0)note(mf(r-12),t,dur*1.6,'sawtooth',.16);note(mf(r+12+ARP[s%8]),t,dur*1.2,'square',.05)}
    else{if(s===0)[0,7,12,16].forEach(i=>note(mf(r+i),t,dur*15,'triangle',.07));if(s%2===0)note(mf(r+24+ARP[(s>>1)%8]),t,dur*3,'sine',.07)}
    nextT+=dur;stp++}}
function sfx(k){if(!ac)return;dst=sg;const t=ac.currentTime;
  if(k==='pick'){note(mf(88),t,.15,'sine',.2);note(mf(95),t+.06,.2,'sine',.15)}else if(k==='die'){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(40,t+.5);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(dst);o.start(t);o.stop(t+.55);hat(t,.5)}
  else[0,4,7,12,16].forEach((i,j)=>note(mf(72+i),t+j*.09,.4,'triangle',.18))}
